[project]
name = "var-finance1"
version = "0.1.0"
description = "Portfolio Value at Risk (historical, parametric, Monte Carlo, Bayesian) and closed-form Markowitz optimization"
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "scipy>=1.18.0",
    "tqdm>=4.70.0",
    "yfinance>=1.6.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]
